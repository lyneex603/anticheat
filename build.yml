name: Build AstraGuard

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Распаковать проект
        run: unzip -q AstraGuard-stage10.zip

      - name: Собрать (mvn package)
        working-directory: AstraGuard
        run: mvn -B package 2>&1 | tee ../build.log

      - name: Сохранить лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Сохранить JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AstraGuard-jar
          path: AstraGuard/target/*.jar
